<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="card-body">
                <h1 class="card-title">Basic Calculator</h1>
                 <div class="input-group">
                     <input type="number" id="number1" placeholder="Enter first number" class="form-control">
                 </div>
                <div class="input-group">
                     <input type="number" id="number2" placeholder="Enter second number" class="form-control">
                </div>
                <select id="operator" class="form-select">
                    <option value="+">+</option>
                    <option value="-">-</option>
                    <option value="*">×</option>
                    <option value="/">÷</option>
                    <option value="%">%</option>
                </select>
                <button onclick="calculate()" class="btn btn-success">Calculate</button>
                <p id="result" class="card-text">Result: </p>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>

</body>
</html>
