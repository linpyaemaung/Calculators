<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Unit Converter</title>
</head>

<body>
    <div class="container">
        <h3>Unit Converter</h3>
        <div class="card">
            <div class="mb-3">
                <label class="form-label">Weight (lb)</label>
                <input type="number" id="lb" class="form-control" placeholder="Enter weight in lb">
            </div>
            <button onclick="convertLbToKg()" class="btn btn-success">Convert LB to KG </button>
            <div id="kgResult"></div>

            <div class="mt-3">
                <label class="form-label">Height</label>
                <div class="mb-3">
                    <input type="number" id="feet" class="form-control" placeholder="Enter feet">
                </div>
                <div class="mb-3">
                     <input type="number" id="inches" class="form-control" placeholder="Enter inches">
                </div>
            </div>
            <button onclick="convertHeightToCm()" class="btn btn-success"> Convert Feet/Inches to CM</button>

            <div id="cmResult"></div>
        </div>
        <div class="back-link">
         <i class="fa-solid fa-arrow-left"></i> <a href="../index.html">Back to BMI Page</a>.
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
