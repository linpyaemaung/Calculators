<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BMI Calculator</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>

       <div class="container">
          <h3>BMI Calculator</h3>
        <div class="card">
            <div class="mt-2">
                    <label for="weight">Weight (kg)</label>
                    <input type="number" id="weight" placeholder="Enter your weight" class="form-control">
            </div>
            <div class="mt-3 mb-3">
                <label for="height">Height (cm)</label>
                <input type="number" id="height" placeholder="Enter your height" class="form-control">
            </div>
            <button onclick="calculateBMI()" class="btn btn-success"> Calculate</button>

            <div id="result"></div>
        </div>
        <div class="convertor-link">
            If you want to convert units, <a href="convertor/index.html">click here</a>.
        </div>
       </div>
    
    <script src="script.js"></script>

</body>

</html>
